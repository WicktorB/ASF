# Change log CH. Propose → Review → Validate → Publish. IDs never renumbered.
items:
  - {id: CH-01, change: "Sales Chat cannot host an agent with its own instructions; such an agent sits on SRF-11, reached from SRF-14", raised_by: One Plan Segment dossier, affects: [SRF-03, D3], status: Proposed}
  - {id: CH-02, change: "Extend the SG-01 tag set (your words, your decision, recommendation) and add a source type (customer-stated, seller-assessment, public-source)", raised_by: "One Plan Segment; competitor intelligence", affects: [SG-01, D5], status: Proposed}
  - {id: CH-03, change: "Clarify whether deterministic components (reader, renderer) count toward an agent's identity under P2", raised_by: One Plan Segment dossier, affects: [BF-04, P2], status: Proposed}
  - {id: CH-04, change: "Add the design pattern 'agent around an existing app': prepare outside the app, assist inside it", raised_by: "SMA, One Plan", affects: [Pattern library], status: Proposed}
  - {id: CH-05, change: "'Scenario' is the unit framed; 'use case' is the level below; applied in v0.4", raised_by: Process stream, affects: [All pages], status: Proposed}
  - {id: CH-06, change: "BF-03 renamed 'Skill and tools (MCP)'; applied in v0.4", raised_by: Process stream, affects: [BF-03, D3, Glossary], status: Proposed}
  - {id: CH-07, change: "Pack restructured in five parts: design canvas (D1 to D5), design process, portfolio, ways of working, deployment; 'five steps' renamed 'five dimensions'; D4 renamed 'Architecture and shared layers'", raised_by: Review of 7 Oct, affects: [All pages], status: Proposed}
  - {id: CH-08, change: "Pack retitled 'ASF Design Framework'", raised_by: Review of 7 Oct, affects: [Start here], status: Proposed}
  - {id: CH-09, change: "Overlap check moved from intake to the workshop, at scenario level; intro call of about 30 minutes with its transcript kept as prefill input", raised_by: Review of 7 Oct, affects: [Design process, Templates], status: Proposed}
  - {id: CH-10, change: "Source of the pack, templates and dossiers moved to a GitHub repository (Markdown and YAML); Word, HTML and PDF generated; templates restructured for readability (one-page overview, canvas card, max four columns per table); Copilot skills maintain them", raised_by: Templates rework of 8 Oct, affects: [Templates, Ways of working, Tools], status: Proposed}
  - {id: CH-11, change: "Repository governance, decided at the task force of week 42 (positions below are the proposals, to confirm): owner of the repository and the build is technical design; PO access mode for phase 3 is issues and PR review only, no IDE; ISD scenarios live in the same repository (or a mirror); transcripts stay in the repository only if it is private and access-controlled, otherwise in the SharePoint library (legal input needed); a pull request needs one approval, agreed by convention per folder, with no code-owner validation; scenario branches are named <scenario>-<update>-<version>", raised_by: "Set-up guide v0.4, decisions of week 42", affects: [Ways of working, Deployment], status: Proposed}
