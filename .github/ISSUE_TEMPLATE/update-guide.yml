name: "3 · Update guide after the workshop"
description: Set statuses, log decisions and open items from the workshop transcript. Assign to Copilot (skill update-workshop-guide).
title: "[scenario] <slug> · update guide"
labels: [scenario, step-4]
body:
  - type: input
    id: slug
    attributes: { label: Scenario slug }
    validations: { required: true }
  - type: input
    id: transcript
    attributes: { label: Workshop transcript file in inputs/, placeholder: "inputs/workshop-2026-10-30.md" }
    validations: { required: true }
  - type: markdown
    attributes: { value: "Skill: `update-workshop-guide`. Reviewer: framing lead, within 48 hours." }
